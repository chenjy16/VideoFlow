[package]
name = "videoflow"
version = "1.0.0"
description = "VideoFlow - a macOS native video & audio downloader powered by yt-dlp"
authors = ["VideoFlow"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "videoflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
log = "0.4"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
incremental = true
