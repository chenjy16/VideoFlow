name: Release

# 发布流水线：三种互相独立的模式（不要混用）
#
#   internal  workflow_dispatch + internal_build=true
#             → 强制 unsigned、不公证、只上传 Actions Artifact，永不创建 Release
#
#   test      推送 v* tag（当前唯一可用的发布方式）
#             → 强制 unsigned、不公证、创建 **GitHub Pre-release**
#             → 不读取、不检查任何 Apple 凭据；也不会因为“没有凭据”被判 BLOCKED
#
#   signed    workflow_dispatch（保留给未来的 Apple Developer Program）
#             → 需要 3 个签名 Secrets + 3 个公证 Secrets；缺凭据即 BLOCKED，不发布
#             → tag 触发不会再走这里：真实签名/公证要等重新启用（见 docs/NOTARIZATION.md）
#
# 无论哪种模式，都保留三道硬门禁：
#   1. 模式由触发方式与输入唯一决定，不做隐式降级
#   2. 公证结论只认 Apple 的返回；unsigned 模式绝不伪造 ACCEPTED、绝不伪造票据
#   3. release job 是唯一持有 contents: write 的 job，且只由 tag 触发
#
# 本项目只使用 App Store Connect **Team** API Key（notarytool 必须带 --issuer），
# 不使用 Apple ID + App-specific Password 路线。私钥仅存在于 $RUNNER_TEMP，用完即删。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建与校验，不创建 Release
        type: boolean
        default: true
      internal_build:
        description: 内部测试构建（无凭据也可产出未签名 Artifact，绝不创建 Release）
        type: boolean
        default: false

# 最小权限：整个工作流只读，发布 job 单独申请 contents: write
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIPLE: aarch64-apple-darwin
  CARGO_TERM_COLOR: always
  # 三种模式互斥，且全部由触发方式唯一决定：
  #   tag                            → test_release（unsigned，创建 Pre-release）
  #   dispatch + internal_build=true → 内部测试构建（unsigned，只出 Artifact）
  #   dispatch 其它情况              → signed 路径（需要 Apple 凭据，缺则 BLOCKED）
  INTERNAL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.internal_build && 'true' || 'false' }}
  TEST_RELEASE: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
  REQUIRE_NOTARIZATION: ${{ (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.internal_build)) && 'false' || 'true' }}

jobs:
  validate:
    name: 校验版本与发布条件
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      signing_mode: ${{ steps.signing.outputs.mode }}
      test_release: ${{ steps.signing.outputs.test_release }}
      notarization_ready: ${{ steps.notarize_creds.outputs.ready }}
    steps:
      - name: 校验 Runner 架构（arm64）
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m: ${arch}"
          [ "${arch}" = "arm64" ] || { echo "::error::发布构建只支持 arm64 Runner，实际为 ${arch}"; exit 1; }

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 校验三处版本号一致（tag 触发时还要与 tag 一致）
        id: version
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json       : ${pkg}"
          echo "tauri.conf.json    : ${conf}"
          echo "src-tauri/Cargo.toml: ${cargo}"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::三处版本号不一致，发布中止"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "git tag            : ${GITHUB_REF_NAME}（解析为 ${tag_version}）"
            # 允许两种 tag 形态：正式版 v<version>，以及不占用正式版本号的测试 tag v<version>-test.<N>
            case "$tag_version" in
              "$pkg")
                echo "tag 与版本号一致"
                ;;
              "$pkg"-test.[0-9]*)
                echo "测试 tag：${GITHUB_REF_NAME}（对应版本 ${pkg}），不占用正式版本号"
                ;;
              *)
                echo "::error::tag ${GITHUB_REF_NAME} 与版本号 ${pkg} 不一致（只允许 v${pkg} 或 v${pkg}-test.<N>），发布中止"
                exit 1
                ;;
            esac
          else
            echo "git ref            : ${GITHUB_REF_NAME}（非 tag，手动触发）"
          fi
          echo "version=${pkg}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: 判定签名模式（严格：齐备或全空，不允许半配置）
        id: signing
        env:
          # 只判断是否存在，不输出任何凭据内容
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          # tag 测试发布：强制 unsigned，且完全不触碰 Apple 签名 Secrets（不统计、不报错）
          if [ "${TEST_RELEASE}" = "true" ]; then
            if [ "${INTERNAL_BUILD}" = "true" ]; then
              echo "::error::TEST_RELEASE 与 INTERNAL_BUILD 互斥"
              exit 1
            fi
            echo "tag 测试发布：强制 unsigned（不检查 Apple 签名 Secrets）"
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
            echo "test_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 内部测试构建一律未签名：内部包要在 DMG 内写标记，签名包改写会破坏签名；
          # 也避免产出"签了名但没公证"的灰色制品。
          if [ "${INTERNAL_BUILD}" = "true" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::internal_build 只能用于手动触发的内部测试，不能用于 tag 发布"
              exit 1
            fi
            echo "内部测试构建：强制 unsigned（忽略签名 Secrets）"
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
            echo "test_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          have=0
          if [ -n "${APPLE_CERTIFICATE}" ]; then have=$((have + 1)); fi
          if [ -n "${APPLE_CERTIFICATE_PASSWORD}" ]; then have=$((have + 1)); fi
          if [ -n "${APPLE_SIGNING_IDENTITY}" ]; then have=$((have + 1)); fi

          if [ "$have" -eq 3 ]; then
            mode=developer-id
            echo "检测到完整的 Developer ID Secrets（3/3）"
          elif [ "$have" -eq 0 ]; then
            mode=unsigned
            echo "未配置 Developer ID Secrets（0/3）"
          else
            echo "::error::Developer ID Secrets 只配置了 ${have}/3：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY 必须全部配置或全部留空，发布中止"
            exit 1
          fi

          # tag 触发意味着要发正式版；未签名产物不允许成为正式 Release
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$mode" = "unsigned" ]; then
            echo "::error::这是 tag 触发的发布构建，但未配置 Developer ID Secrets；未签名产物不能作为正式 Release。请配置三个签名 Secrets，或改用 workflow_dispatch 做内部构建"
            exit 1
          fi

          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "test_release=false" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "developer-id" ]; then
            echo "signing_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 判定公证凭据（Team API Key，严格：齐备或全空）
        id: notarize_creds
        env:
          # 只判断是否存在长度，绝不回显内容
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          # tag 测试发布：明确不要求公证，因此也不读、不统计任何 Apple 凭据
          if [ "${TEST_RELEASE}" = "true" ]; then
            if [ "${REQUIRE_NOTARIZATION}" = "true" ]; then
              echo "::error::TEST_RELEASE=true 时 REQUIRE_NOTARIZATION 必须为 false（当前 ${REQUIRE_NOTARIZATION}）"
              exit 1
            fi
            echo "tag 测试发布：跳过公证凭据检查（产物将标记为 TEST RELEASE - UNSIGNED - NOT NOTARIZED）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 内部测试构建：允许无凭据产出 unsigned Artifact，但绝不能用于正式发布
          if [ "${INTERNAL_BUILD}" = "true" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::internal_build 只能用于手动触发的内部测试，不能用于 tag 发布"
              exit 1
            fi
            if [ "${REQUIRE_NOTARIZATION}" != "false" ]; then
              echo "::error::internal_build=true 时 REQUIRE_NOTARIZATION 必须降级为 false（当前 ${REQUIRE_NOTARIZATION}）"
              exit 1
            fi
            echo "内部测试构建（internal_build=true）：不执行公证，产物名 internal-test-<version>-<sha>，release job 不会运行"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Phase 4 的发布语义是"必须公证"；关掉它会让产物名与实际状态不符
          if [ "${REQUIRE_NOTARIZATION}" != "true" ]; then
            echo "::error::REQUIRE_NOTARIZATION 必须为 true（Phase 4 起未公证产物不得发布）"
            exit 1
          fi

          have=0
          if [ -n "${APPLE_API_KEY}" ]; then have=$((have + 1)); fi
          if [ -n "${APPLE_API_ISSUER}" ]; then have=$((have + 1)); fi
          if [ -n "${APPLE_API_KEY_P8_BASE64}" ]; then have=$((have + 1)); fi

          if [ "$have" -eq 3 ]; then
            ready=true
            echo "检测到完整的公证凭据（3/3，Team API Key）"
          elif [ "$have" -eq 0 ]; then
            ready=false
            echo "未配置公证凭据（0/3）：本轮将记为 BLOCKED，不发布"
          else
            echo "::error::公证凭据只配置了 ${have}/3：APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_P8_BASE64 必须全部配置或全部留空，发布中止"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$ready" = "false" ]; then
            echo "::error::这是 tag 触发的发布构建，但没有公证凭据；未公证产物不能作为正式 Release。请配置三个 App Store Connect Team API Key Secrets"
            exit 1
          fi

          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: 发布条件汇总
        run: |
          {
            echo "### 发布条件"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${{ steps.version.outputs.version }} |"
            echo "| 目标 | aarch64-apple-darwin |"
            echo "| 签名 Secrets | $([ "${{ steps.signing.outputs.mode }}" = "developer-id" ] && echo "3/3 已配置" || echo "未配置") |"
            echo "| 本次签名模式 | ${{ steps.signing.outputs.mode }} |"
            echo "| 公证凭据（Team API Key） | $([ "${{ steps.notarize_creds.outputs.ready }}" = "true" ] && echo "3/3 已配置" || echo "不要求（测试发布/内部构建）/ 未配置 → 预期 BLOCKED") |"
            echo "| 内部测试构建 | ${INTERNAL_BUILD} |"
            echo "| 测试发布（tag） | ${TEST_RELEASE} |"
            echo "| REQUIRE_NOTARIZATION | ${REQUIRE_NOTARIZATION} |"
            echo "| GitHub Release | $([ "${GITHUB_REF_TYPE}" = "tag" ] && echo "全部检查通过后创建" || echo "不创建（非 tag）") |"
          } >> "$GITHUB_STEP_SUMMARY"

  ffmpeg:
    name: 构建 FFmpeg LGPL
    needs: validate
    uses: ./.github/workflows/ffmpeg-lgpl.yml

  build:
    name: 构建 / 签名 / 公证 / 校验 / 打包
    needs: [validate, ffmpeg]
    runs-on: macos-15
    timeout-minutes: 90
    # 只读：构建 job 永远不持有写权限，发布只能由独立的 release job 完成
    permissions:
      contents: read
    env:
      # 签名与公证模式完全由 validate 判定，build 不做任何降级判断
      SIGNING_MODE: ${{ needs.validate.outputs.signing_mode }}
      ALLOW_UNSIGNED: ${{ needs.validate.outputs.signing_mode == 'unsigned' && '1' || '0' }}
      VERSION: ${{ needs.validate.outputs.version }}
      SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
    steps:
      - name: 校验 Runner 架构（arm64）
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m: ${arch}"
          [ "${arch}" = "arm64" ] || { echo "::error::发布构建只支持 arm64 Runner"; exit 1; }

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备 pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: 准备 Node.js（读取 .nvmrc）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖（锁定 lockfile）
        run: pnpm install --frozen-lockfile

      - name: 安装并校验 Rust 工具链
        run: |
          set -euo pipefail
          rustup show
          rustc -vV | tee /tmp/rustc-vv.txt
          grep -qx 'release: 1.100.0' /tmp/rustc-vv.txt || { echo "::error::Rust 版本不是 1.100.0"; exit 1; }
          grep -qx 'host: aarch64-apple-darwin' /tmp/rustc-vv.txt || { echo "::error::Rust host 不是 aarch64-apple-darwin"; exit 1; }

      - name: Cargo 缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      # 必须是全程经过校验的 LGPL 构建产物，绝不回退 Homebrew 或 GPL 构建
      - name: 取回 FFmpeg LGPL 产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-lgpl-binaries
          path: src-tauri/binaries

      - name: 取回 FFmpeg 许可证与再链接材料
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-lgpl-materials
          path: .build/ffmpeg-lgpl-materials

      - name: 复核 FFmpeg LGPL 产物（含许可证材料）
        run: |
          set -euo pipefail
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin
          MATERIALS_DIR="${GITHUB_WORKSPACE}/.build/ffmpeg-lgpl-materials" ./scripts/verify-ffmpeg-lgpl.sh

      - name: 获取并校验 yt-dlp（固定版本 + SHA256）
        run: ./scripts/fetch-yt-dlp.sh

      - name: 导入 Developer ID 证书（临时 keychain）
        if: needs.validate.outputs.signing_mode == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/import-signing-certificate.sh

      # 证书已在 keychain 内，后续只靠 GITHUB_ENV 里的 APPLE_SIGNING_IDENTITY 触签名；
      # 不向 bundler 传任何 APPLE_API_* ，公证完全由下面的 notarize.sh 接管，
      # 这样 Apple 的返回才能被完整记录下来（而不是 bundler 内部静默处理）。
      - name: 构建安装包（签名模式：${{ needs.validate.outputs.signing_mode }}）
        run: |
          # Tauri 的 bundle_dmg.sh 用 hdiutil 挂载临时镜像，在 runner 上偶发
          # “hdiutil: create failed - Resource busy”。这是环境噪声，不是构建错误：
          # 清掉残留挂载点与半成品后重试一次（Rust 与前端产物已缓存，重试很快）。
          cleanup_dmg() {
            local base="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
            for vol in /Volumes/VideoFlow /Volumes/VideoFlow-* /Volumes/dmg.*; do
              [ -e "$vol" ] || continue
              hdiutil detach "$vol" -force -quiet >/dev/null 2>&1 || true
              rmdir "$vol" 2>/dev/null || true
            done
            rm -rf "$base" 2>/dev/null || true
          }

          attempt=1
          while :; do
            cleanup_dmg
            if pnpm tauri build --target aarch64-apple-darwin; then
              echo "构建成功（第 ${attempt} 次）"
              exit 0
            fi
            if [ "$attempt" -ge 2 ]; then
              echo "::error::构建失败（已重试 1 次，仍失败）"
              exit 1
            fi
            echo "::warning::首次构建失败，清理挂载点与 DMG 半成品后重试一次"
            attempt=$((attempt + 1))
            sleep 5
          done

      # 私钥生命周期只覆盖构建步骤；后续校验只需公钥信息，不依赖 keychain
      - name: 清理临时 keychain 与证书
        if: always() && needs.validate.outputs.signing_mode == 'developer-id'
        run: ./scripts/import-signing-certificate.sh --cleanup

      # 公证：私钥解码到 $RUNNER_TEMP，提交后立刻删除；状态取自 Apple 返回的 JSON。
      # 凭据缺失 → BLOCKED 并失败（绝不跳过公证继续发布）。
      - name: Apple 公证（notarytool submit + staple + validate）
        # 只有 signed 模式才提交 Apple：内部构建与 tag 测试发布都不应触碰公证
        if: env.INTERNAL_BUILD != 'true' && env.TEST_RELEASE != 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: ./scripts/notarize.sh

      - name: 确保临时私钥已清除
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}"/AuthKey_*.p8 2>/dev/null || true
          if ls "${RUNNER_TEMP}"/AuthKey_*.p8 >/dev/null 2>&1; then
            echo "::error::临时私钥未清除，中止"
            exit 1
          fi
          echo "临时私钥已确认清除"

      - name: 校验安装包（架构 / 引擎 / 许可证 / 签名 / 公证）
        run: |
          set -euo pipefail
          # developer-id 模式下由导入步骤回填期望值，这里强制断言签名身份与 Team ID
          EXPECTED_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:-}" \
          EXPECTED_TEAM_ID="${VIDEOFLOW_TEAM_ID:-}" \
          NOTARIZATION_STATUS="${NOTARIZATION_STATUS:-$([ "${TEST_RELEASE}" = "true" ] && echo NOT_NOTARIZED || echo '')}" \
            ./scripts/verify-release.sh
          cat verification-report.txt >> "$GITHUB_STEP_SUMMARY"

      # 必须在 staple 之后执行：SHA256SUMS 要覆盖带票据的最终制品
      - name: 整理发布产物与校验和
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          OUT_DIR="${GITHUB_WORKSPACE}/dist-release" \
          VERSION="${VERSION}" \
          TAG="${TAG_NAME}" \
          COMMIT_SHA="${GITHUB_SHA}" \
          TRIPLE="${TRIPLE}" \
          SIGNING_MODE="${SIGNING_MODE}" \
          NOTARIZATION_STATUS="${NOTARIZATION_STATUS:-$([ "${INTERNAL_BUILD}" = "true" ] || [ "${TEST_RELEASE}" = "true" ] && echo NOT_NOTARIZED || echo BLOCKED)}" \
          NOTARIZATION_SUBMISSION_ID="${NOTARIZATION_SUBMISSION_ID:-}" \
          REQUIRE_NOTARIZATION="${REQUIRE_NOTARIZATION}" \
          INTERNAL_BUILD="${INTERNAL_BUILD}" \
          TEST_RELEASE="${TEST_RELEASE}" \
            ./scripts/package-release.sh

      - name: 上传发布候选产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # 产物名就是承诺：
          #   internal_build=true → internal-test-<version>-<short sha>，永远不可能是正式版
          #   tag 测试发布        → test-release-<version>-<short sha>，进 Pre-release
          #   developer-id 分支只能走到这里，而它会先通过公证门禁
          name: ${{ inputs.internal_build == true && format('videoflow-internal-test-{0}-{1}', needs.validate.outputs.version, needs.validate.outputs.short_sha) || (github.ref_type == 'tag' && format('videoflow-test-release-{0}-{1}', needs.validate.outputs.version, needs.validate.outputs.short_sha) || format('videoflow-{0}-{1}', needs.validate.outputs.signing_mode == 'developer-id' && 'signed-notarized' || 'internal-unsigned', needs.validate.outputs.version)) }}
          path: |
            dist-release
            verification-report.txt
            notarization-report.json
          if-no-files-found: error
          retention-days: 30

      # 即使公证失败也要留下证据：Apple 日志、submission ID、失败原因
      - name: 归档公证诊断（失败时也保留）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarization-diagnostics-${{ needs.validate.outputs.version }}
          path: |
            notarization-report.json
            notarization-logs
          if-no-files-found: ignore
          retention-days: 30

      - name: 汇总
        run: |
          {
            echo "### 发布产物"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${VERSION} |"
            echo "| commit | ${SHORT_SHA} |"
            if [ "${TEST_RELEASE}" = "true" ]; then
              echo "| 发布模式 | test-release（unsigned / notarization-free） |"
            elif [ "${INTERNAL_BUILD}" = "true" ]; then
              echo "| 发布模式 | internal-build（只出 Artifact） |"
            else
              echo "| 发布模式 | signed |"
            fi
            echo "| 签名模式 | ${SIGNING_MODE} |"
            echo "| 签名身份 | ${APPLE_SIGNING_IDENTITY:-未签名} |"
            echo "| Team ID | ${VIDEOFLOW_TEAM_ID:-—} |"
            echo "| 公证状态（Apple 返回） | ${NOTARIZATION_STATUS:-未产生} |"
            echo "| Submission ID | ${NOTARIZATION_SUBMISSION_ID:-—} |"
            echo "| FFmpeg | LGPL 静态构建（已通过许可证校验） |"
            echo ""
            if [ "${INTERNAL_BUILD}" = "true" ]; then
              echo "**INTERNAL TEST BUILD - NOT NOTARIZED**"
              echo ""
              echo "仅供内部安装与运行验证，不是正式发布产物，禁止对外分发。"
            elif [ "${TEST_RELEASE}" = "true" ]; then
              echo "**TEST RELEASE - UNSIGNED - NOT NOTARIZED**"
              echo ""
              echo "macOS ARM64 测试发行版：未使用 Developer ID 签名，未经 Apple 公证。"
              echo "安装时 Gatekeeper 可能阻止打开或显示安全警告，需用户自行决定是否信任。"
            elif [ "${NOTARIZATION_STATUS:-}" = "ACCEPTED" ]; then
              echo "已签名 + 已公证 + 已 staple，具备对外分发条件。"
            elif [ "${NOTARIZATION_STATUS:-}" = "BLOCKED" ]; then
              echo "**公证 BLOCKED**：缺少 App Store Connect Team API Key 凭据，产物不发布。"
            else
              echo "**公证未通过**（${NOTARIZATION_STATUS:-未知}）：产物不发布。"
            fi
            echo ""
            if [ "${TEST_RELEASE}" = "true" ]; then
              echo "Release 由 release job 在全部检查通过后创建为 **Pre-release**。"
            else
              echo "Release 由 release job 在全部检查通过后创建。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 唯一持有写权限的 job：只有 tag 触发、且 build 的全部检查通过才会执行
  release:
    name: 创建 GitHub Release
    needs: [validate, build]
    if: github.ref_type == 'tag' && inputs.internal_build != true && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG_NAME: ${{ github.ref_name }}
      # test-release → 创建 Pre-release；signed → 创建正式版（当前不可达，保留未来能力）
      TEST_RELEASE: ${{ needs.validate.outputs.test_release }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 下载发布候选产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # 测试发布与签名发布的产物名不同，绝不能串用
          name: ${{ needs.validate.outputs.test_release == 'true' && format('videoflow-test-release-{0}-{1}', needs.validate.outputs.version, needs.validate.outputs.short_sha) || format('videoflow-signed-notarized-{0}', needs.validate.outputs.version) }}
          path: candidate

      - name: 发布前完整性复核（校验和 / 版本 / 发布结论 / 未被占用）
        run: |
          set -euo pipefail
          cd candidate/dist-release

          echo "== SHA256SUMS =="
          shasum -a 256 -c SHA256SUMS

          echo "== 清单一致性（TEST_RELEASE=${TEST_RELEASE:-false}）=="
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("release-manifest.json", "utf8"));
            const version = process.env.VERSION;
            const tag = process.env.TAG_NAME;
            const testRelease = process.env.TEST_RELEASE === "true";
            const problems = [];
            if (m.version !== version) problems.push(`版本 ${m.version} != ${version}`);
            if (m.tag !== tag) problems.push(`tag ${m.tag} != ${tag}`);
            if (testRelease) {
              // 测试发布：必须是 unsigned + 未公证，且不能出现任何公证痕迹
              if (m.build_kind !== "test-release") problems.push(`build_kind 为 ${m.build_kind}，期望 test-release`);
              if (m.signing?.mode !== "unsigned") problems.push(`签名模式为 ${m.signing?.mode}，测试发布必须 unsigned`);
              if (m.notarization?.status !== "NOT_NOTARIZED") problems.push(`公证状态为 ${m.notarization?.status}，测试发布必须是 NOT_NOTARIZED`);
              if (m.notarization?.ticket_stapled?.dmg !== false) problems.push("测试发布的 DMG 不应带公证票据");
              if (m.notarization?.ticket_stapled?.app !== false) problems.push("测试发布的 .app 不应带公证票据");
              if (m.distribution_notice !== "TEST RELEASE - UNSIGNED - NOT NOTARIZED") problems.push(`distribution_notice 为 "${m.distribution_notice}"，与发布声明不一致`);
            } else {
              if (m.notarization?.status !== "ACCEPTED") problems.push(`公证状态为 ${m.notarization?.status}，不是 ACCEPTED`);
              if (m.notarization?.ticket_stapled?.dmg !== true) problems.push("DMG 未装订票据");
              if (!m.notarization?.submission_id) problems.push("缺少 submission ID");
            }
            if (problems.length) { console.error("::error::" + problems.join("；")); process.exit(1); }
            console.log("清单校验通过");
          '

          if [ "${TEST_RELEASE}" = "true" ]; then
            echo "== 测试发布：确认不携带公证票据 =="
            if xcrun stapler validate ./*.dmg >/dev/null 2>&1; then
              echo "::error::测试发布的 DMG 带上了公证票据，与 unsigned 声明矛盾"
              exit 1
            fi
            echo "无公证票据（预期）"
          else
            echo "== 下载后的票据复验 =="
            xcrun stapler validate ./*.dmg
          fi

          echo "== 拒绝覆盖已有 Tag / Release =="
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG_NAME} 已存在，本项目不覆盖已发布的产物"
            exit 1
          fi
          echo "Release ${TAG_NAME} 尚不存在，可以创建"

      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          if [ "${TEST_RELEASE}" = "true" ]; then
            cat > RELEASE_NOTES.md <<EOF
          VideoFlow ${TAG_NAME} - Test Release

          macOS ARM64 测试发行版：**未签名、未公证（UNSIGNED / NOT NOTARIZED）**。

          安装：下载 DMG 并双击挂载，把 VideoFlow.app 拖入「应用程序」。需 macOS 11.0 或更高版本（Apple Silicon）。

          ## 重要提示

          - 该包没有 Developer ID 签名，也没有经过 Apple 公证，Gatekeeper 可能阻止打开或提示无法验证开发者。
          - 请在确认文件来源可信后自行处理：系统设置 → 隐私与安全性 → 仍要打开；或对 App 执行 xattr -dr com.apple.quarantine 再去隔离后打开。
          - 本项目不声称该包已通过 Apple 公证或 Gatekeeper 完整验收；它是可安装、可运行的测试版本，不是正式稳定版。

          ## 内容

          - 内置 yt-dlp / ffmpeg / ffprobe（FFmpeg 为 LGPL 静态构建）
          - 校验和见 SHA256SUMS；元数据见 release-manifest.json（build_kind=test-release）
          - 许可证与源码获取方式见 THIRD_PARTY_LICENSES.md / SOURCE_OFFER.txt
          EOF
          else
            cat > RELEASE_NOTES.md <<EOF
          VideoFlow ${TAG_NAME}

          安装：下载 DMG，拖入「应用程序」。需 macOS 11.0 或更高版本（Apple Silicon）。

          - 已用 Developer ID 签名，并通过 Apple 公证（staple 已完成）
          - 内置 yt-dlp / ffmpeg / ffprobe（FFmpeg 为 LGPL 静态构建）
          - 校验和见 SHA256SUMS；完整元数据见 release-manifest.json

          许可证与源码获取方式见 THIRD_PARTY_LICENSES.md / SOURCE_OFFER.txt。
          EOF
          fi
          cat RELEASE_NOTES.md

      - name: 创建 Release 并上传资产
        run: |
          set -euo pipefail
          TITLE="VideoFlow ${TAG_NAME}"
          # 不用数组：macOS 自带 bash 3.2 在 set -u 下展开空数组会报 unbound variable
          PRE_ARG=""
          if [ "${TEST_RELEASE}" = "true" ]; then
            TITLE="VideoFlow ${TAG_NAME} - Test Release"
            PRE_ARG="--prerelease"
          fi
          gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${TITLE}" \
            --notes-file RELEASE_NOTES.md \
            ${PRE_ARG} \
            candidate/dist-release/*.dmg \
            candidate/dist-release/*.app.zip \
            candidate/dist-release/release-manifest.json \
            candidate/dist-release/SHA256SUMS \
            candidate/dist-release/THIRD_PARTY_LICENSES.md \
            candidate/dist-release/SOURCE_OFFER.txt

      - name: 断言 Release 已创建且资产齐全
        run: |
          set -euo pipefail
          gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isPrerelease,assets \
            > release.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("release.json", "utf8"));
            const names = r.assets.map(a => a.name).sort();
            const testRelease = process.env.TEST_RELEASE === "true";
            console.log("tag:", r.tagName, "draft:", r.isDraft, "prerelease:", r.isPrerelease, "assets:", names.join(", "));
            const need = [".dmg", ".app.zip", "release-manifest.json", "SHA256SUMS", "THIRD_PARTY_LICENSES.md", "SOURCE_OFFER.txt"];
            const missing = need.filter(suffix => !names.some(n => n.endsWith(suffix)));
            if (r.isDraft) { console.error("::error::Release 仍为 draft"); process.exit(1); }
            if (testRelease && r.isPrerelease !== true) { console.error("::error::测试发布必须是 Pre-release"); process.exit(1); }
            if (missing.length) { console.error("::error::Release 缺少资产: " + missing.join(", ")); process.exit(1); }
            console.log("Release 资产校验通过");
          '
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}" >> "$GITHUB_STEP_SUMMARY"
