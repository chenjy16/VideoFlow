name: Release

# 发布流水线（Phase 3：Developer ID 签名，未公证）
#
# 签名模式只由 Secrets 决定，不做隐式降级：
#   * APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY 三者齐备 → developer-id
#   * 三者全空                                                                     → unsigned（仅内部 Artifact）
#   * 只配置了一部分                                                               → 立即失败
#   * tag(v*) 触发且未配置签名 Secrets                                             → 立即失败（正式 Release 不接受未签名产物）
#
# 本阶段刻意不做的事：
#   * 不创建 GitHub Release（Phase 4）
#   * 不执行 Apple Notarization（本轮要求，保留 REQUIRE_NOTARIZATION 开关）

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建与校验，不发布（Phase 2 恒为 true 语义）
        type: boolean
        default: true

# 最小权限：整个工作流只读。Phase 4 的发布 job 才会单独申请 contents: write。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIPLE: aarch64-apple-darwin
  CARGO_TERM_COLOR: always
  # 本轮不实施 Apple Notarization：状态固定为 NOT_NOTARIZED，且不作为阻断条件。
  # 未来启用时把 REQUIRE_NOTARIZATION 改为 true 并配置 Apple ID 凭据即可。
  REQUIRE_NOTARIZATION: "false"
  NOTARIZATION_STATUS: NOT_NOTARIZED

jobs:
  validate:
    name: 校验版本与发布条件
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing_mode: ${{ steps.signing.outputs.mode }}
    steps:
      - name: 校验 Runner 架构（arm64）
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m: ${arch}"
          [ "${arch}" = "arm64" ] || { echo "::error::发布构建只支持 arm64 Runner，实际为 ${arch}"; exit 1; }

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 校验三处版本号一致（tag 触发时还要与 tag 一致）
        id: version
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json       : ${pkg}"
          echo "tauri.conf.json    : ${conf}"
          echo "src-tauri/Cargo.toml: ${cargo}"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::三处版本号不一致，发布中止"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "git tag            : ${GITHUB_REF_NAME}（解析为 ${tag_version}）"
            if [ "$tag_version" != "$pkg" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与版本号 ${pkg} 不一致，发布中止"
              exit 1
            fi
          else
            echo "git ref            : ${GITHUB_REF_NAME}（非 tag，手动触发）"
          fi
          echo "version=${pkg}" >> "$GITHUB_OUTPUT"

      - name: 判定签名模式（严格：齐备或全空，不允许半配置）
        id: signing
        env:
          # 只判断是否存在，不输出任何凭据内容
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          have=0
          if [ -n "${APPLE_CERTIFICATE}" ]; then have=$((have + 1)); fi
          if [ -n "${APPLE_CERTIFICATE_PASSWORD}" ]; then have=$((have + 1)); fi
          if [ -n "${APPLE_SIGNING_IDENTITY}" ]; then have=$((have + 1)); fi

          if [ "$have" -eq 3 ]; then
            mode=developer-id
            echo "检测到完整的 Developer ID Secrets（3/3）"
          elif [ "$have" -eq 0 ]; then
            mode=unsigned
            echo "未配置 Developer ID Secrets（0/3）"
          else
            echo "::error::Developer ID Secrets 只配置了 ${have}/3：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY 必须全部配置或全部留空，发布中止"
            exit 1
          fi

          # tag 触发意味着要发正式版；未签名产物不允许成为正式 Release
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$mode" = "unsigned" ]; then
            echo "::error::这是 tag 触发的发布构建，但未配置 Developer ID Secrets；未签名产物不能作为正式 Release。请配置三个签名 Secrets，或改用 workflow_dispatch 做内部构建"
            exit 1
          fi

          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "developer-id" ]; then
            echo "signing_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布条件汇总
        run: |
          {
            echo "### 发布条件"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${{ steps.version.outputs.version }} |"
            echo "| 目标 | aarch64-apple-darwin |"
            echo "| 签名 Secrets | $([ "${{ steps.signing.outputs.mode }}" = "developer-id" ] && echo "3/3 已配置" || echo "未配置") |"
            echo "| 本次签名模式 | ${{ steps.signing.outputs.mode }} |"
            echo "| 公证状态 | ${NOTARIZATION_STATUS} |"
            echo "| REQUIRE_NOTARIZATION | ${REQUIRE_NOTARIZATION} |"
            echo "| GitHub Release | 不创建（Phase 4 接入） |"
          } >> "$GITHUB_STEP_SUMMARY"

  ffmpeg:
    name: 构建 FFmpeg LGPL
    needs: validate
    uses: ./.github/workflows/ffmpeg-lgpl.yml

  build:
    name: 构建 / 校验 / 打包（签名模式由 Secrets 决定）
    needs: [validate, ffmpeg]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # 签名模式完全由 validate 判定，build 不做任何降级判断
      SIGNING_MODE: ${{ needs.validate.outputs.signing_mode }}
      ALLOW_UNSIGNED: ${{ needs.validate.outputs.signing_mode == 'unsigned' && '1' || '0' }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 校验 Runner 架构（arm64）
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m: ${arch}"
          [ "${arch}" = "arm64" ] || { echo "::error::发布构建只支持 arm64 Runner"; exit 1; }

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备 pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: 准备 Node.js（读取 .nvmrc）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖（锁定 lockfile）
        run: pnpm install --frozen-lockfile

      - name: 安装并校验 Rust 工具链
        run: |
          set -euo pipefail
          rustup show
          rustc -vV | tee /tmp/rustc-vv.txt
          grep -qx 'release: 1.100.0' /tmp/rustc-vv.txt || { echo "::error::Rust 版本不是 1.100.0"; exit 1; }
          grep -qx 'host: aarch64-apple-darwin' /tmp/rustc-vv.txt || { echo "::error::Rust host 不是 aarch64-apple-darwin"; exit 1; }

      - name: Cargo 缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      # 必须是全程经过校验的 LGPL 构建产物，绝不回退 Homebrew 或 GPL 构建
      - name: 取回 FFmpeg LGPL 产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-lgpl-binaries
          path: src-tauri/binaries

      - name: 取回 FFmpeg 许可证与再链接材料
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-lgpl-materials
          path: .build/ffmpeg-lgpl-materials

      - name: 复核 FFmpeg LGPL 产物（含许可证材料）
        run: |
          set -euo pipefail
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin
          MATERIALS_DIR="${GITHUB_WORKSPACE}/.build/ffmpeg-lgpl-materials" ./scripts/verify-ffmpeg-lgpl.sh

      - name: 获取并校验 yt-dlp（固定版本 + SHA256）
        run: ./scripts/fetch-yt-dlp.sh

      - name: 导入 Developer ID 证书（临时 keychain）
        if: needs.validate.outputs.signing_mode == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/import-signing-certificate.sh

      # 证书已在 keychain 内，后续只靠 GITHUB_ENV 里的 APPLE_SIGNING_IDENTITY 触签名；
      # 不再向 bundler 传 APPLE_CERTIFICATE，避免 Tauri 重复导入证书。
      - name: 构建安装包（签名模式：${{ needs.validate.outputs.signing_mode }}）
        run: pnpm tauri build --target aarch64-apple-darwin

      # 私钥生命周期只覆盖构建步骤；后续校验只需公钥信息，不依赖 keychain
      - name: 清理临时 keychain 与证书
        if: always() && needs.validate.outputs.signing_mode == 'developer-id'
        run: ./scripts/import-signing-certificate.sh --cleanup

      - name: 校验安装包（架构 / 引擎 / 许可证 / 签名状态）
        run: |
          set -euo pipefail
          # developer-id 模式下由导入步骤回填期望值，这里强制断言签名身份与 Team ID
          EXPECTED_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:-}" \
          EXPECTED_TEAM_ID="${VIDEOFLOW_TEAM_ID:-}" \
            ./scripts/verify-release.sh
          cat verification-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 整理发布产物与校验和
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          OUT_DIR="${GITHUB_WORKSPACE}/dist-release" \
          VERSION="${VERSION}" \
          TAG="${TAG_NAME}" \
          COMMIT_SHA="${GITHUB_SHA}" \
          TRIPLE="${TRIPLE}" \
          SIGNING_MODE="${SIGNING_MODE}" \
          NOTARIZATION_STATUS="${NOTARIZATION_STATUS}" \
          REQUIRE_NOTARIZATION="${REQUIRE_NOTARIZATION}" \
            ./scripts/package-release.sh

      - name: 上传发布候选产物（不创建 Release）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: videoflow-${{ needs.validate.outputs.signing_mode == 'developer-id' && 'signed-unnotarized' || 'internal-unsigned' }}-${{ needs.validate.outputs.version }}
          path: |
            dist-release
            verification-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: 汇总
        run: |
          {
            echo "### 发布产物（未创建 GitHub Release）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${VERSION} |"
            echo "| 签名模式 | ${SIGNING_MODE} |"
            echo "| 签名身份 | ${APPLE_SIGNING_IDENTITY:-未签名} |"
            echo "| Team ID | ${VIDEOFLOW_TEAM_ID:-—} |"
            echo "| 公证 | ${NOTARIZATION_STATUS} |"
            echo "| FFmpeg | LGPL 静态构建（已通过许可证校验） |"
            echo ""
            if [ "${SIGNING_MODE}" = "developer-id" ]; then
              echo "签名已完成，但**未公证**：Gatekeeper 仍会拦截，用户需右键打开。"
              echo "对外分发前必须完成 Apple Notarization（本轮按计划未执行）。"
            else
              echo "**未签名产物，仅供内部测试**，禁止对外分发。"
            fi
            echo ""
            echo "**未创建 GitHub Release**：发布 job 属于 Phase 4。"
          } >> "$GITHUB_STEP_SUMMARY"
